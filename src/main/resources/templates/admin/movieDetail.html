<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${movieDetail.title} + ' 상세정보'">영화 상세정보</title>
</head>
<body>
<h1 th:text="${movieDetail.title}">영화 제목</h1>
<h2 th:text="'영문 제목: ' + ${movieDetail.titleEng}">영문 제목</h2>
<p><strong>감독:</strong> <span th:text="${movieDetail.directorNm}">감독 이름</span></p>
<p><strong>회사:</strong> <span th:text="${movieDetail.company}">회사명</span></p>
<p><strong>줄거리:</strong> <span th:text="${movieDetail.plot}">줄거리</span></p>
<p><strong>등급:</strong> <span th:text="${movieDetail.ratingGrade}">등급</span></p>
<p><strong>개봉일:</strong> <span th:text="${movieDetail.releaseDate}">개봉일</span></p>
<p><strong>상영시간:</strong> <span th:text="${movieDetail.runtime}">상영시간</span></p>
<p><strong>장르:</strong> <span th:text="${movieDetail.genre}">장르</span></p>
<img th:src="@{${movieDetail.posterUrl}}" alt="영화 포스터" style="width:300px; height:auto;"/>
<p><strong>영화 아이디:</strong> <span th:text="${movieDetail.docid}">아이디</span></p>
</body>
</html>
