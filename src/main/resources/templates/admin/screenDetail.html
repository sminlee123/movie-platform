<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상영관 상세정보</title>
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .pagination { display: flex; justify-content: center; margin-top: 20px; }
        .pagination a, .pagination span { margin: 0 5px; padding: 8px 12px; border: 1px solid #ddd; text-decoration: none; color: #007bff; }
        .pagination .current { font-weight: bold; background-color: #007bff; color: white; border-color: #007bff; }
        .pagination .disabled { color: #ccc; pointer-events: none; }
    </style>
</head>
<body>
<h1 th:text="|${screen.name} (ID: ${screen.id})|">상영관 정보</h1>

<hr>

<h4>상영정보</h4>
<form th:action="@{/admin/screens/{id}/showings/create(id=${screen.id})}" method="get">
    <button type="submit">상영정보 등록</button>
</form>

<div th:if="${!showingInfo.empty}">
    <table>
        <thead>
        <tr>
            <th>영화 이름</th>
            <th>상영 날짜</th>
            <th>시작 시간</th>
            <th>종료 시간</th>
            <th>가격</th>
            <th>전체 좌석</th>
            <th>예매된 좌석</th>
            <th>남은 좌석</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="showing : ${showingInfo.content}">
            <td th:text="${showing.movieName}">영화 이름</td>
            <td th:text="${showing.showingDate}">2025-10-01</td>
            <td th:text="${showing.startTime}">14:30</td>
            <td th:text="${showing.endTime}">16:40</td>
            <td th:text="${showing.price}">15000</td>
            <td th:text="${showing.totalSeatCount}">전체 좌석</td>
            <td th:text="${showing.bookSeatCount}">예매된 좌석</td>
            <td th:text="${showing.availableSeatCount}">남은 좌석</td>
            <td>
                <form th:action="@{/admin/showings/{id}(id=${showing.id})}" method="post">
                    <input type="hidden" name="_method" value="delete"/>
                    <button type="submit" onclick="return confirm('정말 삭제하시겠습니까?');">삭제</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="pagination" th:if="${showingInfo.totalPages > 1}">
    <a th:href="@{/admin/screen/{id}(id=${screen.id}, page=${showingInfo.number - 1})}"
       th:classappend="${showingInfo.first} ? 'disabled'">이전</a>

    <span th:each="pageNum : ${#numbers.sequence(0, showingInfo.totalPages - 1)}">
            <a th:href="@{/admin/screen/{id}(id=${screen.id}, page=${pageNum})}"
               th:text="${pageNum + 1}"
               th:classappend="${pageNum == showingInfo.number} ? 'current'"></a>
        </span>

    <a th:href="@{/admin/screen/{id}(id=${screen.id}, page=${showingInfo.number + 1})}"
       th:classappend="${showingInfo.last} ? 'disabled'">다음</a>
</div>

<h2>좌석 예매 테스트</h2>
<form id="bookForm">
    <input type="hidden" id="screenId" name="screenId" th:value="${screen.id}">

    <div>
        <label for="seatName">예매할 좌석 이름:</label>
        <input type="text" id="seatName" name="seatName" placeholder="예: A1" required>
    </div>

    <button type="button" onclick="bookSeat()">좌석 예매하기</button>
</form>

<script>
    function bookSeat() {
        const screenIdValue = document.getElementById('screenId').value;
        const seatNameValue = document.getElementById('seatName').value;

        if (!seatNameValue) {
            alert('좌석 이름을 입력해주세요.');
            return;
        }

        // 서버의 @RequestBody DTO와 형식을 맞춰 JSON 데이터 생성
        const requestData = {
            screenId: screenIdValue,
            seatName: seatNameValue
        };

        // fetch API를 사용하여 PATCH 요청 보내기
        fetch('/admin/seats/book', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(requestData)
        })
            .then(response => {
                if (response.ok) {
                    return response.text(); // 성공 응답의 본문을 텍스트로 읽음
                }
                throw new Error('좌석을 예매할 수 없습니다.');
            })
            .then(data => {
                alert('요청 성공: ' + data); // 컨트롤러에서 보낸 성공 메시지 출력
                window.location.reload(); // 예매 성공 후 페이지를 새로고침하여 남은 좌석 수를 갱신
            })
            .catch(error => {
                console.error('Error:', error);
                alert(error.message);
            });
    }
</script>
</body>
</html>
