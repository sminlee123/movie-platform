<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상영관 생성</title>
</head>
<body>
<h1>상영관 생성</h1>
<form action="/admin/screens" method="post">
    <div>
        <label for="name">상영관 이름:</label>
        <input type="text" id="name" name="name" required>
    </div>
    <div>
        <label for="rows">행 (Rows):</label>
        <input type="number" id="rows" name="rows" min="1" max="10" required>
    </div>
    <div>
        <label for="cols">열 (Cols):</label>
        <input type="number" id="cols" name="cols" min="1" max="10" required>
    </div>
    <button type="submit">생성</button>
</form>
</body>
</html>
