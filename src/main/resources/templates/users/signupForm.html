<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>회원가입</title>
</head>
<body>

<h2>회원가입</h2>

<form th:action="@{/signup}" th:object="${userCreateRequest}" method="post">
    <p>
        <label for="username">이름:</label>
        <input type="text" id="username" th:field="*{username}" placeholder="이름을 입력하세요" required />
    </p>

    <p>
        <label for="email">이메일:</label>
        <input type="email" id="email" th:field="*{email}" placeholder="이메일을 입력하세요" required />
    </p>

    <p>
        <label for="password">비밀번호:</label>
        <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required />
    </p>

<!--    <p>-->
<!--        <label for="confirmPassword">비밀번호 확인:</label>-->
<!--        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="비밀번호를 다시 입력하세요" required />-->
<!--    </p>-->

    <p>
        <label for="phoneNumber">전화번호:</label>
        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" placeholder="전화번호를 입력하세요" required />
    </p>

    <p>
        <label for="birthDay">생년월일:</label>
        <input type="date" id="birthDay" th:field="*{birthDay}" required />
    </p>

    <p>
        <button type="submit">회원가입</button>
    </p>
</form>

</body>
</html>
