<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>마이 페이지</title>
</head>
<body>
<form th:action="@{/mypage/me}" method="get">
    <button type="submit">내 정보</button>
</form>

<form th:action="@{/mypage/edit}" method="get">
    <button type="submit">정보 수정</button>
</form>

<form th:action="@{/mypage}" method="post" style="display:inline;">
    <input type="hidden" name="_method" value="delete"/>
    <button type="submit" onclick="return confirm('정말 탈퇴하시겠습니까?');">회원 탈퇴</button>
</form>

</body>
</html>
