<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>유저 정보</title>
</head>
<body>
<p>이름: <span th:text="${user.userName}"></span></p>
<p>이메일: <span th:text="${user.email}"></span></p>
<p>전화번호: <span th:text="${user.phoneNumber}"></span></p>
<p>생년월일: <span th:text="${user.birthDay}"></span></p>
<p>역할 : <span th:text="${user.isAdmin} ? '관리자' : '유저'">유저</span></p>
</body>
</html>
