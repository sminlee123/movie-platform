<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <title>Home</title>
</head>
<body>
<h1>환영합니다!</h1>
<p>홈에 오신 것을 환영합니다.</p>
<!-- 로그인 상태일 때만 로그아웃 버튼 표시 -->
<form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
    <button type="submit">로그아웃</button>
</form>
<!-- 로그인 상태일 때만 마이페이지 버튼 표시 -->
<form th:action="@{/mypage}" method="get" sec:authorize="isAuthenticated()">
    <button type="submit">마이페이지</button>
</form>

<!-- 인증되지 않은 사용자에게 로그인 버튼 표시 -->
<button type="button" th:onclick="|location.href='@{/login}'|" sec:authorize="isAnonymous()">로그인</button>

<p th:if="${name != null}">
    안녕하세요, <span th:text="${name}"></span> 님!
</p>

</body>
</html>
