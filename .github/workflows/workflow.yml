name: workflow  # 워크 플로우 이름

# workflow 실행 트리거
on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

# 작업 단위
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # job을 실행하는 서버 환경 (가상 머신)

    # job 안의 단계
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven  # 의존성 캐싱

      - name: Build
        run: mvn clean package

      # 도커 배포 작업
      # 로그인
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./target
          file: ./Dockerfile # Dockerfile 파일명
          push: true # 빌드 후 이미지를 Docker Hub에 푸시
          tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest # 사용자이름 / 이미지 이름 : 태그

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker network create my-app-network || true
            
            docker pull ${{ secrets.DOCKER_USERNAME }}/my-app:latest
            
            if [ "$(docker ps -a -q -f name=my-running-app)" ]; then
              docker stop my-running-app
              docker rm my-running-app
            fi
            
            docker run -d  \
              -m 512m \
              -e SPRING_DATASOURCE_URL='${{ secrets.DB_URL }}' \
              -e SPRING_DATASOURCE_USERNAME='${{ secrets.DB_USERNAME }}' \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e MYAPI_KEY='${{ secrets.MYAPI_KEY }}' \
              -e SPRING_PROFILES_ACTIVE=prod \
              --network my-app-network \
              --name my-running-app \
              ${{ secrets.DOCKER_USERNAME }}/my-app:latest